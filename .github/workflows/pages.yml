name: Testar e publicar VISUCARDS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: visucards-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar aplicativo e cotas gratuitas
        run: node --test tests/*.test.cjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Preparar interface pública
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp selection.js site/selection.js
          cp pdf-intelligence.js site/pdf-intelligence.js
          cp card-design.js site/card-design.js
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
